name: Prometheus Protocol - Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica Python
        run: python3 --version
      - name: Test suite
        run: python3 -m unittest discover -v
      - name: Simulazione senza invii e senza scritture archivio
        run: python3 simulate_publication.py
      - name: Verifica live feed riparati (sola lettura)
        run: python3 verify_feeds.py
      - name: Verifica live JSON AI (nessuna pubblicazione)
        run: python3 verify_generation.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
