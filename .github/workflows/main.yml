name: Prometheus Protocol - News Collector RSS

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/stabilization-2026-11-04b]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegui raccolta e test senza inviare a Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4
      - name: Verifica Python
        run: python3 --version
      - name: Suite test completa
        run: python3 -m unittest discover -v

  operate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prometheus-main-cycle
      cancel-in-progress: false
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4
      - name: Raccogli le notizie internazionali
        run: python3 news_collector.py
      - name: Pulizia archivio settimanale
        run: python3 -c "from news_collector import clean_published_articles; clean_published_articles()"
      - name: Pubblica notizie nuove su Telegram
        run: python3 telegram_publisher.py --scheduled
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva archivio dopo la pubblicazione
        if: success()
        run: |
          if ! git diff --quiet -- published_articles.json publisher_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published_articles.json publisher_state.json
            git commit -m "Update published articles archive"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
