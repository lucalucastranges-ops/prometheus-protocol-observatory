name: Prometheus Protocol - News Collector RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Verifica Python
        run: python3 --version

      - name: Raccogli le notizie internazionali
        run: python3 news_collector.py
        
      - name: Verifica raccolta Telegram Estero 24H
        run: python3 telegram_collector.py

      
      - name: Pulizia archivio settimanale
        run: python3 -c "from news_collector import clean_published_articles; clean_published_articles()"
  

      - name: Salva archivio aggiornato
        run: |
          if ! git diff --quiet -- published_articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published_articles.json
            git commit -m "Update weekly published articles archive"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

       - name: Test modulo Telegram senza pubblicazione
         run: python3 telegram_publisher.py
