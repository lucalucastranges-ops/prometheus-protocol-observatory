name: Prometheus Protocol - News Collector RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Verifica Python
        run: python3 --version

      - name: Raccogli le notizie internazionali
        run: python3 news_collector.py
        
      - name: Verifica raccolta Telegram Estero 24H
        run: python3 telegram_collector.py
